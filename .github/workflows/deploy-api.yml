name: Publica o Worker

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Os kits do web/ (#60) saem do GitHub Packages da org.
  packages: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    # Só publica a main: um disparo manual a partir de outra branch não chega à produção.
    if: github.ref == 'refs/heads/main'
    # Os secrets BARTE_ACADEMY_* só existem no environment producao, que aceita só a main (#234):
    # uma branch empurrada por quem tem escrita não chega a eles.
    environment: producao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A tela (#60): o Worker publica web/dist como os arquivos dele, então ela é montada antes.
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O AUD e o domínio do time do Access (#54) e a URL do Supabase (#59) são variáveis do
      # repositório, não segredos. Entram pelo env e são lidos no shell, sem expressão do Actions na
      # linha de comando. Vazios, o Worker sobe fechado: fora do /health, sem token responde 401 e com
      # token responde 503.
      # O nível de cada pessoa que aprova (#63) também é variável do repositório: um JSON de e-mail
      # para nível. Vazio, ninguém aprova (fail-closed): a fila aparece e o formulário não.
      # Os administradores (#174) são variável do repositório: um JSON de lista de e-mails. Vazio, ninguém
      # reconfere (fail-closed).
      - run: npx wrangler deploy --var "ACCESS_AUD:$ACCESS_AUD" --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "BARTE_ACADEMY_SUPABASE_URL:$BARTE_ACADEMY_SUPABASE_URL" --var "APPROVER_LEVELS:$APPROVER_LEVELS" --var "BARTE_ACADEMY_ADMIN_EMAILS:$BARTE_ACADEMY_ADMIN_EMAILS"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_AUD: ${{ vars.BARTE_ACADEMY_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.BARTE_ACADEMY_ACCESS_TEAM_DOMAIN }}
          BARTE_ACADEMY_SUPABASE_URL: ${{ vars.BARTE_ACADEMY_SUPABASE_URL }}
          APPROVER_LEVELS: ${{ vars.BARTE_ACADEMY_APPROVER_LEVELS }}
          BARTE_ACADEMY_ADMIN_EMAILS: ${{ vars.BARTE_ACADEMY_ADMIN_EMAILS }}
      # A chave secreta só existe no Worker: entra pela entrada padrão, sem aparecer no log nem no git (#59).
      - run: printf '%s' "$BARTE_ACADEMY_SUPABASE_SECRET_KEY" | npx wrangler secret put BARTE_ACADEMY_SUPABASE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          BARTE_ACADEMY_SUPABASE_SECRET_KEY: ${{ secrets.BARTE_ACADEMY_SUPABASE_SECRET_KEY }}
      # A chave da API da Anthropic (#171) é a credencial principal do Claude no Worker. Entra pela entrada
      # padrão, sem aparecer no log nem no git. Enquanto o secret do GitHub não existir, o valor vem vazio:
      # o passo é pulado, para não quebrar o deploy nem gravar um secret vazio por cima do que já está no Worker.
      - run: |
          if [ -z "$BARTE_ACADEMY_ANTHROPIC_API_KEY" ]; then
            echo "Secret BARTE_ACADEMY_ANTHROPIC_API_KEY ausente no environment producao: passo pulado."
          else
            printf '%s' "$BARTE_ACADEMY_ANTHROPIC_API_KEY" | npx wrangler secret put BARTE_ACADEMY_ANTHROPIC_API_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          BARTE_ACADEMY_ANTHROPIC_API_KEY: ${{ secrets.BARTE_ACADEMY_ANTHROPIC_API_KEY }}
      # O setup token do Claude Code (#171) é o caminho secundário: o cliente só o usa sem a chave da API acima,
      # e a Anthropic pode barrá-lo (429 sem retry-after). Só existe no Worker, como a chave do Supabase: entra
      # pela entrada padrão, sem aparecer no log nem no git.
      - run: printf '%s' "$BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN" | npx wrangler secret put BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BARTE_ACADEMY_CLOUDFLARE_ACCOUNT_ID }}
          BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.BARTE_ACADEMY_CLAUDE_CODE_OAUTH_TOKEN }}
